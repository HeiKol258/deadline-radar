[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deadline-radar"
version = "0.1.0"
description = "A small CLI that ranks deadline risk and visualizes task pressure."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "HeiKol258"}]
dependencies = [
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
deadline-radar = "deadline_radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
